name: Test SSH Deployment
on:
  workflow_dispatch:

jobs:
  test_ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DISTRIBUTION_SSH_KEY }}

      - name: Debug SSH Agent
        run: ssh-add -l

      - name: Test SSH Connections
        run: |
          echo "Testing Homebrew..."
          GIT_SSH_COMMAND="ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" git clone git@github.com:zbrlang/homebrew-tap.git test_homebrew
          
          echo "Testing AUR..."
          GIT_SSH_COMMAND="ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" git clone git@github.com:zbrlang/aur-package.git test_aur
          
          echo "Testing Winget..."
          GIT_SSH_COMMAND="ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" git clone git@github.com:zbrlang/winget-packages.git test_winget
          
          echo "Testing Scoop..."
          GIT_SSH_COMMAND="ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" git clone git@github.com:zbrlang/scoop-bucket.git test_scoop

      - name: Success
        run: echo "All repositories cloned successfully! SSH keys are working."
