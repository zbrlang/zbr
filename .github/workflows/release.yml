name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: zbr
            asset_name: zbr-linux-x64
            cross: false
          - os: ubuntu-latest
            target: aarch64-linux-android
            binary: zbr
            asset_name: zbr-linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: zbr
            asset_name: zbr-darwin-x64
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: zbr
            asset_name: zbr-darwin-arm64
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: zbr.exe
            asset_name: zbr-windows-x64.exe
            cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: zbr.exe
            asset_name: zbr-windows-arm64.exe
            cross: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" == "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ matrix.binary }}" != "${{ matrix.asset_name }}" ]; then
            mv target/${{ matrix.target }}/release/${{ matrix.binary }} target/${{ matrix.target }}/release/${{ matrix.asset_name }}
          fi

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.asset_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy_all:
    name: Deploy to All Channels
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DISTRIBUTION_SSH_KEY }}

      - name: Extract version from tag
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download Binaries
        run: |
          gh release download ${{ github.ref_name }} --pattern "zbr-*"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- NPM (Temporarily Disabled - Uncomment to re-enable) ---
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #     registry-url: 'https://registry.npmjs.org'
      # - name: Publish to NPM
      #   run: |
      #     # (NPM logic here)
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Calculate Hashes
        id: hashes
        run: |
          echo "DARWIN_X64=$(sha256sum zbr-darwin-x64 | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "DARWIN_ARM64=$(sha256sum zbr-darwin-arm64 | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "LINUX_X64=$(sha256sum zbr-linux-x64 | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "LINUX_ARM64=$(sha256sum zbr-linux-arm64 | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "WIN_X64=$(sha256sum zbr-windows-x64.exe | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "WIN_ARM64=$(sha256sum zbr-windows-arm64.exe | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Update Homebrew
        run: |
          rm -rf tap
          git clone git@github.com:zbrlang/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp homebrew/zbr.rb tap/Formula/zbr.rb
          sed -i "s/REPLACE_ME_SHA256_DARWIN_X64/$DARWIN_X64/" tap/Formula/zbr.rb
          sed -i "s/REPLACE_ME_SHA256_DARWIN_ARM64/$DARWIN_ARM64/" tap/Formula/zbr.rb
          sed -i "s/REPLACE_ME_SHA256_LINUX_X64/$LINUX_X64/" tap/Formula/zbr.rb
          sed -i "s/REPLACE_ME_SHA256_LINUX_ARM64/$LINUX_ARM64/" tap/Formula/zbr.rb
          cd tap
          git config user.name "ZBR CI"
          git config user.email "ci@zbrlang.com"
          git add .
          git commit -m "Update zbr to ${{ github.ref_name }}"
          git push

      - name: Update AUR
        run: |
          rm -rf aur
          git clone git@github.com:zbrlang/aur-package.git aur
          cp aur/PKGBUILD aur/PKGBUILD
          sed -i "s/pkgver=.*$/pkgver=${{ steps.tag_version.outputs.VERSION }}/" aur/PKGBUILD
          sed -i "s/REPLACE_ME_SHA256_LINUX_X64/$LINUX_X64/" aur/PKGBUILD
          sed -i "s/REPLACE_ME_SHA256_LINUX_ARM64/$LINUX_ARM64/" aur/PKGBUILD
          cd aur
          git config user.name "ZBR CI"
          git config user.email "ci@zbrlang.com"
          git add .
          git commit -m "Update zbr to ${{ github.ref_name }}"
          git push

      - name: Update Winget
        run: |
          rm -rf winget
          git clone git@github.com:zbrlang/winget-packages.git winget
          cp winget/zbr.yaml winget/zbr.yaml
          sed -i "s/PackageVersion: .*$/PackageVersion: ${{ steps.tag_version.outputs.VERSION }}/" winget/zbr.yaml
          sed -i "s/REPLACE_ME_SHA256_WINDOWS_X64/$WIN_X64/" winget/zbr.yaml
          sed -i "s/REPLACE_ME_SHA256_WINDOWS_ARM64/$WIN_ARM64/" winget/zbr.yaml
          cd winget
          git config user.name "ZBR CI"
          git config user.email "ci@zbrlang.com"
          git add .
          git commit -m "Update zbr to ${{ github.ref_name }}"
          git push

      - name: Update Scoop
        run: |
          rm -rf bucket
          git clone git@github.com:zbrlang/scoop-bucket.git bucket
          cp scoop/zbr.json bucket/zbr.json
          sed -i "s/REPLACE_ME_SHA256_WINDOWS_X64/$WIN_X64/" bucket/zbr.json
          sed -i "s/REPLACE_ME_SHA256_WINDOWS_ARM64/$WIN_ARM64/" bucket/zbr.json
          cd bucket
          git config user.name "ZBR CI"
          git config user.email "ci@zbrlang.com"
          git add .
          git commit -m "Update zbr to ${{ github.ref_name }}"
          git push

  rebuild_hf_space:
    name: Rebuild HF Space
    needs: deploy_all
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Rebuild
        run: |
          git clone https://Zubariel:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/zbrlang/zbr-server hf-space
          cd hf-space
          echo ${{ github.ref_name }} > .build-version
          sed -i "s/ARG CACHEBUST=.*/ARG CACHEBUST=$(date +%s)/" Dockerfile
          git config user.email "ci@zbrlang.com"
          git config user.name "ZBR CI"
          git add .build-version Dockerfile
          git commit -m "rebuild for ${{ github.ref_name }}"
          git push
